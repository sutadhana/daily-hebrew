// ======== Graded reader tab: dialogues by level, tap a word for transliteration and meaning, Nikud on/off ========
const GR_LEVELS=[[1,'Level 1','Beginner · present tense, everyday situations'],[2,'Level 2','Intermediate · past tense'],[3,'Level 3','Advanced · future tense and slang']];
const GR_NQ=/[֑-ׇֽֿׁׂׅׄ]/g;
const grPlain=s=>s.replace(/ב[\u05B0-\u05C7]*\u05B9[\u05B0-\u05C7]*ק[\u05B0-\u05C7]*ר/g,'בוקר').replace(/עֹמֶר/g,'עומר').replace(GR_NQ,'');
const grEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const GRD=(()=>{const out=[];let cur=null;
 GR_SRC.trim().split('\n').forEach(raw=>{const ln=raw.trim();if(!ln)return;
  if(ln[0]=='@'){const f=ln.slice(1).split('|');cur={lv:+f[0],id:f[1],he:f[2],en:f[3],sp:[{he:f[4],en:f[5]},{he:f[6],en:f[7]}],lines:[]};out.push(cur);return}
  const parts=ln.split('|'),who=parts.shift()=='A'?0:1;
  cur.lines.push({s:who,w:parts.map(t=>{const[v,tr,g,pl]=t.split('~');const m=v.match(/^(.*?)([.,?!…]+)$/);return{v:m?m[1]:v,p:m?m[2]:'',tr,g,pl}})});
 });return out})();
let GRS={lv:sel.l.size==1?[0,1,1,2,3][[...sel.l][0]]:1,d:null,pop:null};
let GR_NIK=true;try{GR_NIK=localStorage.getItem('hvp_nik')!=='0'}catch(e){}
const grWord=(w,pl)=>GR_NIK?w:(pl||grPlain(w));
function reader(){
 tab='read';R=null;
 const d=GRS.d!=null?GRD[GRS.d]:null;
 const nikBtn=`<button class="chip grnik" data-gn=1 aria-pressed=${GR_NIK}>${GR_NIK?'Nikud: on':'Nikud: off'}</button>`;
 if(!d){
  const list=GRD.map((x,i)=>[x,i]).filter(([x])=>x.lv==GRS.lv);
  const lvl=GR_LEVELS.find(l=>l[0]==GRS.lv);
  $('#app').innerHTML=`${tabs('read')}<h1>Graded reader</h1><p class=sub>Short everyday dialogues. Tap any word to see how it's pronounced and what it means.</p>
  <h2>Choose a level</h2><div class="chips grlv">${GR_LEVELS.map(([n,t,s])=>`<button class=chip data-gl=${n} aria-pressed=${GRS.lv==n}><b>${t}</b><small>${s.split(' · ')[0]}</small></button>`).join('')}</div>
  <p class=sub style="margin-top:10px">${lvl[2]}</p>
  <h2>Dialogues</h2><div class=vl>${list.map(([x,i])=>`<button class=vb data-gd=${i}><span><b dir=rtl>${grWord(x.he)}</b><br><small>${grEsc(x.en)} · ${x.sp[0].en} &amp; ${x.sp[1].en}</small></span><span aria-hidden=true>›</span></button>`).join('')}</div>
  <div class=grbar>${nikBtn} ${trBtn()}</div>`;
  return;
 }
 const lines=d.lines.map((l,li)=>{const sp=d.sp[l.s];
  return `<div class="grl ${l.s?'grb':'gra'}"><div class=grn>${grWord(sp.he)} <small>${sp.en}</small></div><p class=grt dir=rtl lang=he>${l.w.map((w,wi)=>`<button class=gw data-gw="${li}.${wi}"><span class=gwh>${grWord(w.v,w.pl)}${w.p}</span><span class=gwt>${grEsc(w.tr||'')}</span></button>`).join(' ')}</p></div>`}).join('');
 $('#app').innerHTML=`${tabs('read')}<div class=grhd><button class="btn alt back" data-gb=1>← Dialogues</button>${nikBtn} ${trBtn()}</div>
 <p class=meta>${GR_LEVELS.find(l=>l[0]==d.lv)[1]}</p><h1 dir=rtl class=grh>${grWord(d.he)}</h1><p class=sub>${grEsc(d.en)}</p>
 <p class=note>Tap any word for its transliteration and meaning.</p><div class=grd>${lines}</div>
 <p class=grend>${(()=>{const sib=GRD.map((x,i)=>[x,i]).filter(([x])=>x.lv==d.lv),k=sib.findIndex(([,i])=>i==GRS.d),nx=sib[k+1];return nx?`<button class=btn data-gd=${nx[1]}>Next dialogue →</button>`:`<button class="btn alt" data-gb=1>Back to the list</button>`})()}</p>`;
 grPop();
}
function grPop(){
 let el=document.getElementById('grpop');
 if(!GRS.pop||GRS.d==null||tab!='read'){if(el)el.remove();document.querySelectorAll('.gw.on').forEach(b=>b.classList.remove('on'));return}
 const[li,wi]=GRS.pop,w=GRD[GRS.d].lines[li].w[wi];
 if(!el){el=document.createElement('div');el.id='grpop';el.setAttribute('role','dialog');document.body.appendChild(el)}
 el.innerHTML=`<button class=grx data-gx=1 aria-label=Close>✕</button><div class=grpw dir=rtl lang=he>${grWord(w.v,w.pl)}</div><div class=grpp>${GR_NIK?'Without':'With'} Nikud: <span dir=rtl lang=he>${GR_NIK?(w.pl||grPlain(w.v)):w.v}</span></div><div class=grptr>${grEsc(w.tr)}</div><div class=grpg>${grEsc(w.g)}</div>`;
 document.querySelectorAll('.gw.on').forEach(b=>b.classList.remove('on'));
 const b=document.querySelector(`.gw[data-gw="${li}.${wi}"]`);if(b)b.classList.add('on');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b){if(GRS.pop&&!e.target.closest('#grpop')){GRS.pop=null;grPop()}return}
 const D=b.dataset||{};
 if(D.tab&&D.tab!='read'){GRS.pop=null;grPop();return}
 if(D.gl){GRS.lv=+D.gl;reader()}
 else if(D.gd!==undefined){GRS.d=+D.gd;GRS.pop=null;reader();window.scrollTo(0,0)}
 else if(D.gb){GRS.d=null;GRS.pop=null;grPop();reader();window.scrollTo(0,0)}
 else if(D.gn){GR_NIK=!GR_NIK;try{localStorage.setItem('hvp_nik',GR_NIK?'1':'0')}catch(x){}reader()}
 else if(D.gw){const p=D.gw.split('.').map(Number);GRS.pop=GRS.pop&&GRS.pop[0]==p[0]&&GRS.pop[1]==p[1]?null:p;grPop()}
 else if(D.gx){GRS.pop=null;grPop()}
 else if(GRS.pop&&!b.closest('#grpop')){GRS.pop=null;grPop()}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&GRS.pop){GRS.pop=null;grPop()}});

</script>
